                        - moderator
                        - uploader
        StatusRequest:
            type: object
            additionalProperties: false
        SetupStatusView:
            type: object
            required:
                - billing
                - provision
                - mapbox
                - usgs
                - analytics
                - crash
                - secretsRev
                - ready
                - generatedAt
            properties:
                billing:
                    type: object
                    required:
                        - state
                        - checkedAt
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                        budgetId:
                            type: string
                        budgetAmount:
                            type: number
                        currency:
                            type: string
                provision:
                    type: object
                    required:
                        - state
                        - checkedAt
                        - items
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                        items:
                            type: array
                            items:
                                type: object
                mapbox:
                    type: object
                    required:
                        - state
                        - checkedAt
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                        user:
                            type: string
                        scopes:
                            type: array
                            items:
                                type: string
                usgs:
                    type: object
                    required:
                        - state
                        - checkedAt
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                        role:
                            type: string
                            enum:
                                - download
                                - search
                analytics:
                    type: object
                    required:
                        - state
                        - checkedAt
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                        measurementId:
                            type: string
                crash:
                    type: object
                    required:
                        - state
                        - checkedAt
                    properties:
                        state:
                            type: string
                            enum:
                                - ok
                                - pending
                                - action-required
                                - error
                        checkedAt:
                            $ref: '#/components/schemas/IsoTime'
                            nullable: true
                secretsRev:
                    type: integer
                    minimum: 0
                ready:
                    type: boolean
                generatedAt:
                    $ref: '#/components/schemas/IsoTime'
                install:
