components:
    parameters:
        WorkerStarterCity:
            name: city
            in: query
            required: true
            description: City ID target
            schema:
                $ref: '#/components/schemas/CityId'
        WorkerStarterOs:
            name: os
            in: query
            required: true
            description: Operating system of the worker host
            schema:
                type: string
                enum:
                    - linux
                    - mac
                    - windows
        WorkerStarterAction:
            name: action
            in: query
            required: true
            description: Install or uninstall starter action
            schema:
                type: string
                enum:
                    - install
                    - uninstall
    securitySchemes:
        FirebaseAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: 'Firebase ID token for authenticated Google accounts.

                Role tiers: signedIn, member, admin, cityEditor, cityReviewer, cityOwner,
                projectOwner.'
        WorkerToken:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: 'Custom Firebase token minted for paired local workers (claims:
                worker=true, city, pair).'
        AppCheck:
            type: apiKey
            in: header
            name: X-Firebase-AppCheck
            description: Firebase App Check token. Required in 'enforce' and 'consume'
                modes.
    responses:
        InvalidArgumentError:
            description: Invalid argument or schema validation failure.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        UnauthenticatedError:
            description: Caller lacks valid credentials or App Check attestation.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        PermissionDeniedError:
            description: Caller is not authorized for the requested city or administrative
                action.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        NotFoundError:
            description: Requested entity, job, or resource was not found.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        AlreadyExistsError:
            description: Entity or resource already exists.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        RateLimitedError:
            description: Client or instance rate limit exceeded.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        UnavailableError:
            description: Upstream service (USGS, Mapbox, Vertex AI) is temporarily
                unavailable.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
        InternalError:
            description: Internal server execution failure.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CallableErrorResponse'
    schemas:
        Id:
            type: string
            maxLength: 64
            pattern: ^[a-z0-9_-]{1,64}$
            description: Standard Firestore entity identifier slug.
        CityId:
            type: string
            maxLength: 32
            pattern: ^[a-z0-9-]{2,32}$
            description: City identifier slug (e.g. bucharest).
        Sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: 64-character lowercase hexadecimal SHA-256 hash.
        Uid:
            type: string
            pattern: ^[A-Za-z0-9]{20,40}$
            description: Firebase Auth user identifier.
        IsoTime:
            type: string
            format: date-time
            description: ISO 8601 UTC timestamp.
        IsoDate:
            type: string
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: ISO 8601 calendar date (YYYY-MM-DD).
        LatLng:
            type: object
            required:
                - lat
                - lng
            properties:
                lat:
                    type: number
                    minimum: -90
                    maximum: 90
                lng:
                    type: number
                    minimum: -180
                    maximum: 180
            description: Geographic coordinates as latitude and longitude.
        LngLat:
            type: array
            items:
                type: number
            minItems: 2
            maxItems: 2
            description: Coordinates array [longitude, latitude] matching GeoJSON
                and Mapbox GL conventions.
        Bbox:
            type: array
            items:
                type: number
            minItems: 4
            maxItems: 4
            description: Bounding box array [west, south, east, north].
        BoundsRecord:
            type: object
            required:
                - north
                - south
                - east
                - west
            properties:
                north:
                    type: number
                    minimum: -90
                    maximum: 90
                south:
                    type: number
                    minimum: -90
                    maximum: 90
                east:
                    type: number
                    minimum: -180
                    maximum: 180
                west:
                    type: number
                    minimum: -180
                    maximum: 180
            description: Geographic bounds dictionary with cardinal directional boundaries.
        LocalizedText:
            type: object
            description: Localized string map keyed by language code (ro, en, fr,
                etc.).
            additionalProperties:
                type: string
        LocalizedPartial:
            type: object
            description: Partially localized string dictionary.
            additionalProperties:
                type: string
        Link:
            type: object
            required:
                - title
                - url
            properties:
                title:
                    $ref: '#/components/schemas/LocalizedText'
                url:
                    type: string
                    format: uri
        Credit:
            type: object
            required:
                - label
            properties:
                label:
                    $ref: '#/components/schemas/LocalizedText'
                url:
                    type: string
                    format: uri
        Theme:
            type: object
            required:
                - seedColor
                - tokens
            properties:
                seedColor:
                    type: string
                    pattern: ^#[0-9a-fA-F]{6}$
                tokens:
                    type: object
                    required:
                        - light
                        - dark
                        - highContrastLight
                        - highContrastDark
                    properties:
                        light:
                            type: object
                            additionalProperties:
                                type: string
                        dark:
                            type: object
                            additionalProperties:
                                type: string
                        highContrastLight:
                            type: object
                            additionalProperties:
                                type: string
                        highContrastDark:
                            type: object
                            additionalProperties:
                                type: string
        Basemap:
            type: object
            required:
                - style
            properties:
                style:
                    type: string
                config:
                    type: object
                    additionalProperties:
                        oneOf:
                            -   type: string
                            -   type: number
                            -   type: boolean
        LayerSource:
            oneOf:
                -   $ref: '#/components/schemas/MapboxLayerSource'
                -   $ref: '#/components/schemas/XyzLayerSource'
                -   $ref: '#/components/schemas/PmtilesLayerSource'
        MapboxLayerSource:
            type: object
            required:
                - type
                - tilesetId
            properties:
                type:
                    type: string
                    enum:
                        - mapbox
                tilesetId:
                    type: string
                    pattern: ^[a-z0-9_-]{1,32}\.[A-Za-z0-9_-]{1,64}$
        XyzLayerSource:
            type: object
            required:
                - type
                - tiles
                - tileSize
            properties:
                type:
                    type: string
                    enum:
                        - xyz
                tiles:
                    type: array
                    items:
                        type: string
                        format: uri
                    minItems: 1
                    maxItems: 4
                tileSize:
                    type: integer
                    enum:
                        - 256
                        - 512
        PmtilesLayerSource:
            type: object
            required:
                - type
                - url
            properties:
                type:
                    type: string
                    enum:
                        - pmtiles
                url:
                    type: string
                    format: uri
        CallableErrorResponse:
            type: object
            required:
                - error
            properties:
                error:
                    $ref: '#/components/schemas/FirebaseFunctionsError'
        FirebaseFunctionsError:
            type: object
            required:
                - status
                - message
            properties:
                status:
                    type: string
                    enum:
                        - invalid-argument
                        - unauthenticated
                        - permission-denied
                        - not-found
                        - already-exists
                        - aborted
                        - failed-precondition
                        - resource-exhausted
                        - unavailable
                        - internal
                message:
                    type: string
                    description: API error code identifier (e.g. apiError.invalidRequest).
                details:
                    $ref: '#/components/schemas/ApiErrorDetails'
        ApiErrorDetails:
            type: object
            required:
                - code
            properties:
                code:
                    type: string
                    description: Structured i18n error code.
                params:
                    type: object
                    additionalProperties:
                        type: string
                    description: Template parameters for localized error messages.
                issues:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValidationIssue'
                    description: Validation issues list (when code is apiError.invalidRequest).
        ValidationIssue:
            type: object
            required:
                - path
                - code
            properties:
                path:
                    type: string
                    description: Property path of the invalid field.
                code:
                    type: string
                    description: Validation constraint failure code.
        SessionRequest:
            type: object
            additionalProperties: false
        SessionResponse:
            type: object
            required:
                - admin
                - role
                - claim
                - refreshToken
                - ownerClaimed
                - invitePending
                - cities
                - projectOwner
            properties:
                admin:
                    type: boolean
                role:
                    type: string
                    enum:
                        - owner
                        - editor
                        - moderator
                        - uploader
                    nullable: true
                claim:
                    type: boolean
                refreshToken:
                    type: boolean
                ownerClaimed:
                    type: boolean
                invitePending:
                    type: boolean
                cities:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionCity'
                    maxItems: 100
                projectOwner:
                    type: boolean
        SessionCity:
            type: object
            required:
                - id
                - role
                - name
            properties:
                id:
                    $ref: '#/components/schemas/CityId'
                role:
                    type: string
                    enum:
                        - owner
                        - editor
                        - moderator
                        - uploader
                name:
                    $ref: '#/components/schemas/LocalizedPartial'
        ClaimRequest:
            type: object
            required:
                - googleAccessToken
            properties:
                googleAccessToken:
                    type: string
                    minLength: 20
                    maxLength: 4096
        ClaimResponse:
            type: object
            required:
                - role
                - refreshToken
            properties:
                role:
                    type: string
                    enum:
                        - owner
                refreshToken:
                    type: boolean
                    enum:
                        - true
        JoinRequest:
            type: object
