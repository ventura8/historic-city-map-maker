openapi: 3.1.0
info:
    title: Historic City Map Maker API
    version: 1.0.0
    description: 'OpenAPI 3.1 specification for Historic City Map Maker (ventura8/historic-city-map-maker).


        This API encompasses:

        1. **Firebase Functions v2 HTTPS Endpoints** (`onRequest`): public telemetry
        error reporting and worker starter downloads.

        2. **Firebase Callable Functions** (`onCall`): authenticated backend operations
        across administration, cloud setup, raster georeferencing, publishing, community
        review, and local worker orchestration.

        3. **Security & App Check**: Google authentication (Firebase ID tokens), worker
        custom tokens, and App Check attestation modes (enforce, consume, off).

        4. **Viewer Static Contract**: public City Manifest v1, WebP photo derivatives,
        and PWA webmanifest.'
    contact:
        name: Historic City Map Maker
        url: https://github.com/ventura8/historic-city-map-maker
    license:
        name: UNLICENSED
servers:
    -   url: https://us-central1-{projectId}.cloudfunctions.net
        description: Firebase Cloud Functions v2 deployment in us-central1
        variables:
            projectId:
                default: demo-hcm
                description: Google Cloud / Firebase project ID
    -   url: https://storage.googleapis.com/{publicBucket}
        description: Public Cloud Storage bucket for static viewer assets and manifest.json
        variables:
            publicBucket:
                default: demo-hcm-public
                description: Public Cloud Storage bucket name
tags:
    -   name: Admin
        description: Session verification, project claims, invites, and role delegation.
    -   name: Setup
        description: Setup Assistant, cloud provisioning, secrets management, and
            self-tests.
    -   name: Content
        description: Manifest publication, photo processing, and layer management.
    -   name: Imagery
        description: Historical aerial & satellite imagery search, import, georeferencing,
            calibration, and publishing.
    -   name: Orders
        description: USGS EarthExplorer scan purchase tracking and verification.
    -   name: Assists
        description: Nominatim reverse geocoding and Vertex AI Gemini translation
            drafts.
    -   name: Notifications
        description: FCM push device registration and test notifications.
    -   name: Cities
        description: Multi-city management, bounding boxes, quotas, and custom icon.
    -   name: Export
        description: Static city zip archive creation and signed download URLs.
    -   name: Worker
        description: Local worker machine registration, job leasing, signed URLs,
            and local archive sync.
    -   name: Community
        description: Contribute page, role requests, reviews, and photo location/correction
            suggestions.
    -   name: Telemetry
        description: Client crash reporting and Cloud Error Reporting group statistics.
    -   name: Viewer
        description: Public static viewer contract (City Manifest v1, photos, webmanifest).
